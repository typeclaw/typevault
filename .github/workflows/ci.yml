name: CI

on:
  push:
    branches: [main]
  pull_request:

# PRs share a group so a new push supersedes the old run; every push to main gets its own group so post-merge runs
# always finish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: typecheck / lint / format / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: `latest` makes setup-bun query api.github.com, which intermittently 401s.
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun test

  windows:
    # Native Windows support: the same checks on windows-latest, so a Windows regression (paths, file locks, the
    # daemon's sockets and shutdown) shows up before merge. Static checks run first and fail fast. The longer
    # --timeout absorbs the slower runner; timeout-minutes caps a hung run on a 2x-cost runner.
    name: windows checks (typecheck / lint / format / test)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun test --timeout 30000
